[package]
name = "zazuko-rvv"
version = "0.1.0"
edition = "2024"
description = "Fast RDF vocabulary validator: checks every class and property IRI against well-known vocabularies (schema.org, OWL, SKOS, …)."
license = "Apache-2.0"
repository = "https://github.com/ktk/vocab-validator"
homepage = "https://github.com/ktk/vocab-validator"
readme = "README.md"
keywords = ["rdf", "validation", "vocabulary", "schema-org", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "rvv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sophia = "0.9.0"
tar = "0.4.44"

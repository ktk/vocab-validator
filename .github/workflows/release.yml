name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        id: package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE=rvv-${VERSION}-${{ matrix.target }}.tar.gz
          tar -czf ${ARCHIVE} -C target/${{ matrix.target }}/release rvv
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 ${ARCHIVE} | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

    outputs:
      version: ${{ steps.package.outputs.version }}

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  update-tap:
    name: Update Homebrew tap
    needs: [build, release]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Compute SHA256 sums
        id: sha
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          for f in dist/*.tar.gz; do
            target=$(basename "$f" | sed "s/rvv-${VERSION}-//" | sed 's/\.tar\.gz//')
            sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
            echo "${target}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v4
        with:
          repository: ktk/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          SHA_AARCH64_DARWIN: ${{ steps.sha.outputs.aarch64-apple-darwin }}
          SHA_X86_64_DARWIN: ${{ steps.sha.outputs.x86_64-apple-darwin }}
          SHA_AARCH64_LINUX: ${{ steps.sha.outputs.aarch64-unknown-linux-gnu }}
          SHA_X86_64_LINUX: ${{ steps.sha.outputs.x86_64-unknown-linux-gnu }}
        run: |
          FORMULA=homebrew-tap/Formula/rvv.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          sed -i "s/REPLACE_WITH_SHA256_aarch64-apple-darwin/${SHA_AARCH64_DARWIN}/" "$FORMULA"
          sed -i "s/REPLACE_WITH_SHA256_x86_64-apple-darwin/${SHA_X86_64_DARWIN}/" "$FORMULA"
          sed -i "s/REPLACE_WITH_SHA256_aarch64-unknown-linux-gnu/${SHA_AARCH64_LINUX}/" "$FORMULA"
          sed -i "s/REPLACE_WITH_SHA256_x86_64-unknown-linux-gnu/${SHA_X86_64_LINUX}/" "$FORMULA"

      - name: Commit and push formula update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rvv.rb
          git commit -m "rvv ${{ steps.sha.outputs.version }}"
          git push
